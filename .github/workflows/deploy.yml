name: Deploy to Vercel (production)

# Auto-deploys every push to main to the order-dashboard Vercel project.
# Requires ONE repo secret: VERCEL_TOKEN (a Vercel access token from the team
# that owns the project). Org/Project IDs are public-safe identifiers.

on:
  push:
    branches: [main]

# Avoid overlapping deploys; cancel an in-progress one when a newer push lands.
concurrency:
  group: vercel-prod
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_DASgXXcCv8kZsRqHscKOigJS
  VERCEL_PROJECT_ID: prj_NF5NaXyXmWHGFq3HLZ3BCilvlkps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
